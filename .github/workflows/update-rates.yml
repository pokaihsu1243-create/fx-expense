name: 每日更新兆豐匯率

on:
  schedule:
    - cron: "40 8 * * *"   # 台灣 16:40（16:00 收盤匯率出來後）
    - cron: "30 12 * * *"  # 台灣 20:30 補跑一次，以防第一次失敗或延遲
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓兆豐匯率
        run: python update_rates.py
      - name: 有變動就存回
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "匯率沒有變動"
          else
            git commit -m "更新兆豐匯率 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
