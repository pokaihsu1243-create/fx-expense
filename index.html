<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出差報支匯率查詢</title>
<style>
  :root { --ink:#1f2933; --sub:#5f6b7a; --line:#d9dee5; --bg:#f4f6f8; --card:#fff; --accent:#7a2e8e; --warn:#b45309; --bad:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 "Microsoft JhengHei","PingFang TC",sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--sub); margin:0 0 18px; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; }
  select, input[type=date], input[type=text], input[type=number] { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:inherit; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:6px 8px; text-align:left; vertical-align:middle; }
  th { font-size:13px; color:var(--sub); font-weight:600; white-space:nowrap; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  #inTable td { border-bottom:1px solid var(--line); }
  #inTable input[type=text] { width:100%; }
  #inTable .a { width:110px; text-align:right; }
  #inTable .g { width:110px; }
  .btn { font:inherit; padding:7px 16px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; color:inherit; }
  .btn:hover { border-color:var(--accent); }
  .btn.pri { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  .btn.x { padding:2px 9px; color:var(--sub); }
  #inTable td.mv { white-space:nowrap; padding-right:2px; }
  #inTable .h { cursor:grab; color:var(--sub); padding:2px 6px; font-size:16px; user-select:none; }
  #inTable .mvb { padding:1px 6px; font-size:12px; color:var(--sub); }
  #inTable tr.dragging { opacity:.4; }
  #inTable tr.flash td { background:#f3e8f7; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:12px; }
  .fill { display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:14px; color:var(--sub); }
  .fill input[type=number] { width:64px; }
  #msg { margin-top:10px; color:var(--bad); min-height:1.4em; }
  .scroll { overflow-x:auto; }
  #result { display:none; }

  /* 報支表（仿會計格式） */
  #sheet { background:#fff; padding:14px 16px; color:#000; }
  #sheet .top { display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  #sheet .title { font-size:17px; font-weight:700; border:none; padding:2px 0; width:100%; min-width:260px; color:#000; background:transparent; }
  #sheet .rule { font-size:12.5px; color:#333; margin-top:4px; line-height:1.5; }
  #sheet table { width:auto; }
  #sheet .rt td, #sheet .rt th, #sheet .dt td, #sheet .dt th { border:1px solid #888; padding:4px 8px; font-size:13.5px; color:#000; }
  #sheet .rt th { background:#f0f0f0; }
  #sheet .rt .red { color:#c00000; font-weight:700; }
  #sheet .dt { width:100%; }
  #sheet .dt th { background:#f0f0f0; }
  #sheet .dt tr.grp td { font-weight:700; background:#fafafa; }
  #sheet .dt tr.sub td { font-weight:700; }
  #sheet .dt tr.tot td { font-weight:700; font-size:15px; border-top:2px solid #000; }
  #sheet .remark { font-size:12px; color:var(--warn); }
  #sheet .bad { color:var(--bad); }
  #sheet .foot { font-size:12px; color:#333; margin-top:8px; line-height:1.5; word-break:break-all; }
  @media print {
    body { background:#fff; }
    main { max-width:none; padding:0; }
    .no-print { display:none !important; }
    .card { border:none; padding:0; margin:0; }
    #sheet { padding:0; }
    #sheet .remark { color:#000; }
  }
</style>
</head>
<body>
<main>
  <div class="no-print">
    <h1>出差報支匯率查詢</h1>
    <p class="sub">照會計的算法：兆豐銀行・即期・銀行買入匯率，用消費當天的；假日沒有牌告就往前取最近一個營業日。<br><span id="dataInfo"></span>　填的明細只存在自己的瀏覽器，不會上傳。</p>

    <div class="card">
      <h2>支出明細</h2>
      <div class="fill">
        快速產生連續日期：起日 <input type="date" id="fStart">
        天數 <input type="number" id="fDays" min="1" max="60" value="1">
        <button class="btn" id="fGo" type="button">產生</button>
      </div>
      <div class="scroll">
      <table id="inTable" style="margin-top:10px">
        <thead><tr><th title="拖曳 ⠿ 或按 ↑↓ 調整順序">順序</th><th>消費日期</th><th>類別</th><th>說明（選填）</th><th>幣別</th><th class="num">外幣金額</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      </div>
      <datalist id="groups"><option value="餐費"><option value="計程車"><option value="交際費"><option value="住宿"><option value="交通"><option value="雜費"></datalist>
      <div class="bar">
        <button class="btn" id="add" type="button">＋ 加一列</button>
        <button class="btn" id="clear" type="button">清空</button>
        <button class="btn" id="exportRows" type="button" title="把目前的明細存成檔案，換電腦或換瀏覽器時可匯入">匯出紀錄</button>
        <button class="btn" id="importRows" type="button" title="讀回之前匯出的明細檔">匯入紀錄</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
        <span style="flex:1"></span>
        <label class="sub" style="margin:0">取當天哪一筆 <select id="cat"></select></label>
        <button class="btn pri" id="go" type="button">算台幣</button>
      </div>
      <div id="msg"></div>
    </div>
  </div>

  <div class="card" id="result">
    <div id="sheet">
      <div class="top">
        <div style="flex:1;min-width:260px">
          <input class="title" id="title" type="text">
          <div class="rule" id="rule"></div>
        </div>
        <table class="rt">
          <thead><tr><th>兆豐即期匯率</th><th class="red">買入</th><th>更新日期</th><th>用於消費日</th></tr></thead>
          <tbody id="rtBody"></tbody>
        </table>
      </div>
      <table class="dt">
        <thead><tr><th>消費日期</th><th>類別</th><th>說明</th><th>幣別</th><th class="num">外幣金額</th><th class="num">匯率</th><th class="num">台幣</th></tr></thead>
        <tbody id="dtBody"></tbody>
      </table>
      <div class="foot" id="foot"></div>
    </div>
    <div class="bar no-print">
      <button class="btn pri" id="png" type="button">存成圖片（佐證）</button>
      <button class="btn" id="print" type="button">列印／存 PDF</button>
      <button class="btn" id="copy" type="button">複製表格（貼到 Excel）</button>
      <a class="btn" id="src" target="_blank" rel="noopener" style="text-decoration:none">開兆豐官網核對</a>
      <span id="copied" class="sub" style="margin:0"></span>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const tbody = $('#inTable tbody');
let currencies = [];
let last = null;
const KEY = 'fx-expense-rows-v2';  // 不要改這個名字，改了舊紀錄會讀不到
const TWD_OPT = { code: 'TWD', label: '新台幣（不換算）' };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function curOptions(sel) {
  return currencies.map(c => '<option value="' + c.code + '"' + (c.code === sel ? ' selected' : '') + '>' + esc(c.code) + '</option>').join('');
}
function todayStr() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }

function addRow(r, before) {
  r = r || {};
  const tr = document.createElement('tr');
  tr.innerHTML =
    '<td class="mv"><span class="h" draggable="true" title="按住拖曳移動">⠿</span>' +
    '<button class="btn mvb up" type="button" title="上移">↑</button>' +
    '<button class="btn mvb dn" type="button" title="下移">↓</button>' +
    '<button class="btn mvb ins" type="button" title="在這列下方插入一列">＋</button></td>' +
    '<td><input type="date" class="d" max="' + todayStr() + '" value="' + esc(r.date || '') + '"></td>' +
    '<td><input type="text" class="g" list="groups" value="' + esc(r.group || '餐費') + '"></td>' +
    '<td><input type="text" class="n" value="' + esc(r.note || '') + '"></td>' +
    '<td><select class="c">' + curOptions(r.currency || 'USD') + '</select></td>' +
    '<td class="num"><input type="text" inputmode="decimal" class="a" value="' + esc(r.amount || '') + '"></td>' +
    '<td><button class="btn x" type="button" title="刪除這列">×</button></td>';
  tr.querySelector('.x').onclick = () => { tr.remove(); if (!tbody.children.length) addRow(); save(); };
  tr.querySelector('.up').onclick = () => { if (tr.previousElementSibling) { tbody.insertBefore(tr, tr.previousElementSibling); moved(tr); } };
  tr.querySelector('.dn').onclick = () => { if (tr.nextElementSibling) { tbody.insertBefore(tr.nextElementSibling, tr); moved(tr); } };
  tr.querySelector('.ins').onclick = () => {
    const cur = readRow(tr);
    const nr = addRow({ date: cur.date, group: cur.group, currency: cur.currency }, tr.nextElementSibling);
    moved(nr); nr.querySelector('.n').focus();
  };
  const h = tr.querySelector('.h');
  h.addEventListener('dragstart', e => { dragRow = tr; tr.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', ''); e.dataTransfer.setDragImage(tr, 10, 10); } catch (_) {} });
  h.addEventListener('dragend', () => { tr.classList.remove('dragging'); dragRow = null; save(); });
  if (before) tbody.insertBefore(tr, before); else tbody.appendChild(tr);
  return tr;
}
// 列的順序調整（拖曳 ⠿ 或 ↑↓）；順序會一起存起來，算台幣時類別也照第一次出現的順序排
let dragRow = null;
tbody.addEventListener('dragover', e => {
  if (!dragRow) return;
  e.preventDefault();
  const over = e.target.closest('tr');
  if (!over || over === dragRow || over.parentNode !== tbody) return;
  const r = over.getBoundingClientRect();
  tbody.insertBefore(dragRow, e.clientY < r.top + r.height / 2 ? over : over.nextElementSibling);
});
tbody.addEventListener('drop', e => { if (dragRow) e.preventDefault(); });
function moved(tr) { save(); tr.classList.add('flash'); setTimeout(() => tr.classList.remove('flash'), 400); }
function readRow(tr) {
  return { date: tr.querySelector('.d').value, group: tr.querySelector('.g').value.trim(),
    note: tr.querySelector('.n').value.trim(), currency: tr.querySelector('.c').value,
    amount: tr.querySelector('.a').value.trim() };
}
function readRows() { return [...tbody.children].map(readRow); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(readRows())); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }

// ---- 匯率資料：網頁版讀 GitHub 每天自動更新的 data/*.json；本機版由 server.py 即時提供同格式 ----
let meta = null;
const ratesCache = {};
const LOOKBACK_DAYS = 15;  // 假日往前找營業日，最多回看幾天
const SOURCE = '兆豐國際商業銀行官網－匯率查詢－歷史匯率';
const SOURCE_URL = 'https://www.megabank.com.tw/personal/savings/foreign-service/forex?tab=3';

async function getJson(url) {
  const res = await fetch(url, { cache: 'no-cache' });
  let j = null;
  try { j = await res.json(); } catch (e) {}
  if (!res.ok || !j) throw new Error((j && j.error) || ('讀取 ' + url + ' 失敗（' + res.status + '）'));
  return j;
}
async function getRates(code) {
  if (!ratesCache[code]) ratesCache[code] = await getJson('data/rates/' + code + '.json');
  return ratesCache[code];
}
function addDays(d, n) { const [y, m, dd] = d.split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd + n)).toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 86400000); }
// 精確的「外幣 × 匯率 → 四捨五入到元」（用整數運算，避免小數誤差；.5 一律進位，與 Python ROUND_HALF_UP 相同）
function decParse(s) {
  s = String(s).trim(); const neg = s.startsWith('-'); if (neg || s.startsWith('+')) s = s.slice(1);
  const [i, f = ''] = s.split('.');
  return { n: BigInt((i || '0') + f) * (neg ? -1n : 1n), s: f.length };
}
function mulRound(a, b) {
  const x = decParse(a), y = decParse(b);
  let p = x.n * y.n; const neg = p < 0n; if (neg) p = -p;
  const base = 10n ** BigInt(x.s + y.s);
  let q = p / base; if ((p % base) * 2n >= base) q += 1n;
  return Number(neg ? -q : q);
}

// 會計算法：兆豐・即期・銀行買入・消費當天；假日往前取最近營業日；每筆四捨五入到元，小計＝各筆加總
async function lookup(items, category) {
  const today = todayStr();
  const curInfo = {}; meta.currencies.forEach(c => { curInfo[c.code] = c; });
  const parsed = items.map((it, k) => {
    const i = k + 1, d = String(it.date || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || isNaN(Date.parse(d))) throw new Error('第 ' + i + ' 列日期格式不對');
    const code = String(it.currency || '').trim().toUpperCase() || 'USD';
    if (d > today) throw new Error('第 ' + i + ' 列日期 ' + d + ' 還沒到，查不到匯率');
    const amt = String(it.amount || '').replace(/,/g, '').trim();
    if (amt && !/^[+-]?(\d+\.?\d*|\.\d+)$/.test(amt)) throw new Error('第 ' + i + ' 列金額不是數字');
    if (code !== 'TWD') {
      const ci = curInfo[code];
      if (!ci) throw new Error('第 ' + i + ' 列：兆豐沒有 ' + code + ' 的即期匯率，請改用新台幣（TWD）填實際扣款金額');
      if (d > ci.coveredThrough) throw new Error('第 ' + i + ' 列 ' + d + ' 的 ' + code + ' 匯率還沒更新（目前只到 ' + ci.coveredThrough + '，每天下午約 5 點更新）');
    }
    return { date: d, currency: code, amount: amt, group: String(it.group || '').trim() || '其他', note: String(it.note || '').trim() };
  });
  const tables = {};
  for (const code of [...new Set(parsed.map(p => p.currency))].filter(c => c !== 'TWD').sort()) {
    tables[code] = (await getRates(code))[category] || {};
  }
  const groups = {}, order = [], rateTbl = {};
  let missing = 0;
  for (const p of parsed) {
    const row = { date: p.date, currency: p.currency, note: p.note, amount: p.amount, usedDate: null, rate: null, twd: null, remark: '' };
    if (p.currency === 'TWD') {  // 新台幣消費：不換算，直接四捨五入到元
      row.usedDate = p.date; row.rate = '1';
      if (p.amount !== '') row.twd = mulRound(p.amount, '1');
    } else {
      const tbl = tables[p.currency];
      let used = p.date;
      while (!(used in tbl) && daysBetween(used, p.date) < LOOKBACK_DAYS) used = addDays(used, -1);
      if (used in tbl && tbl[used]) {
        const buy = tbl[used];
        row.usedDate = used; row.rate = buy;
        const key = p.currency + '|' + used;
        if (!rateTbl[key]) rateTbl[key] = { currency: p.currency, rateDate: used, rate: buy, forDates: [] };
        if (!rateTbl[key].forDates.includes(p.date)) rateTbl[key].forDates.push(p.date);
        if (used !== p.date) row.remark = p.date.slice(5).replace('-', '/') + ' 無牌告，採前一營業日 ' + used.slice(5).replace('-', '/');
        if (p.amount !== '') row.twd = mulRound(p.amount, buy);
      } else {
        const first = Object.keys(tbl).sort()[0];
        row.remark = '查無匯率' + (first && p.date < first ? '（網頁版只保留最近 ' + (meta.keepMonths || 3) + ' 個月匯率，最早到 ' + first + '；更早的請用本機版查）' : '');
        missing++;
      }
    }
    if (!groups[p.group]) { groups[p.group] = { name: p.group, rows: [], subtotal: 0 }; order.push(p.group); }
    groups[p.group].rows.push(row);
    if (row.twd != null) groups[p.group].subtotal += row.twd;
  }
  const outGroups = order.map(n => groups[n]);
  const dates = parsed.map(p => p.date).sort();
  const n = new Date();
  return {
    groups: outGroups, totalTwd: outGroups.reduce((s, g) => s + g.subtotal, 0), missing,
    rateTable: Object.keys(rateTbl).sort().map(k => rateTbl[k]),
    dateFrom: dates[0], dateTo: dates[dates.length - 1],
    categoryLabel: meta.categories[category],
    queriedAt: todayStr() + ' ' + String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0'),
    dataUpdatedAt: meta.updatedAt, source: SOURCE, sourceUrl: SOURCE_URL,
  };
}

async function init() {
  try {
    meta = await getJson('data/meta.json');
    currencies = [TWD_OPT].concat(meta.currencies.filter(c => c.code !== 'TWD'));
    $('#cat').innerHTML = Object.entries(meta.categories).map(([k, v]) => '<option value="' + k + '">' + esc(v) + '</option>').join('');
    $('#dataInfo').textContent = '匯率資料更新時間：' + meta.updatedAt + (meta.mode === 'local' ? '（本機即時查詢）' : '（每天下午約 5 點自動更新，保留最近 ' + (meta.keepMonths || 3) + ' 個月）');
  } catch (e) {
    $('#msg').textContent = '讀不到匯率資料：' + e.message + '（請確認網路後重新整理）';
    currencies = [TWD_OPT, { code: 'USD', label: '美元USD' }];
  }
  const saved = load().filter(r => r.date || r.amount);
  if (saved.length) saved.forEach(r => addRow(r)); else addRow();
}

// ---- 紀錄匯出／匯入（換電腦、換瀏覽器時搬資料用；檔案只存在自己電腦）----
$('#exportRows').onclick = () => {
  const rows = readRows().filter(r => r.date || r.amount || r.note);
  const blob = new Blob([JSON.stringify(rows, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.download = '報支明細紀錄_' + todayStr().replace(/-/g, '') + '.json';
  a.href = URL.createObjectURL(blob); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('#importRows').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const arr = JSON.parse(await f.text());
    if (!Array.isArray(arr)) throw new Error('格式不對');
    const rows = arr.filter(r => r && typeof r === 'object').map(r => ({
      date: String(r.date || ''), group: String(r.group || ''), note: String(r.note || ''),
      currency: String(r.currency || 'USD'), amount: String(r.amount == null ? '' : r.amount) }));
    if (!rows.length) throw new Error('檔案裡沒有明細');
    const has = readRows().some(r => r.date || r.amount || r.note);
    if (has && !confirm('匯入會取代目前畫面上的 ' + readRows().length + ' 列明細，確定嗎？')) return;
    tbody.innerHTML = ''; rows.forEach(r => addRow(r)); save();
    $('#msg').textContent = ''; $('#result').style.display = 'none';
  } catch (err) { $('#msg').textContent = '匯入失敗：' + err.message; }
};

$('#add').onclick = () => {
  const rows = readRows(); const prev = rows[rows.length - 1] || {};
  addRow({ date: prev.date, group: prev.group, currency: prev.currency });
};
$('#clear').onclick = () => { tbody.innerHTML = ''; addRow(); save(); $('#result').style.display = 'none'; };
tbody.addEventListener('change', save);

$('#fGo').onclick = () => {
  const s = $('#fStart').value, n = parseInt($('#fDays').value, 10) || 0;
  if (!s || n < 1) { $('#msg').textContent = '請先選起日並填天數'; return; }
  $('#msg').textContent = '';
  const rows = readRows().filter(r => r.date || r.amount);
  tbody.innerHTML = '';
  rows.forEach(r => addRow(r));
  const [y, m, d] = s.split('-').map(Number);
  for (let i = 0; i < Math.min(n, 60); i++) {
    const dt = new Date(Date.UTC(y, m - 1, d + i));
    addRow({ date: dt.toISOString().slice(0, 10) });
  }
  save();
};

function fmt(n) { return n == null ? '' : Number(n).toLocaleString('en-US'); }
function fmtAmt(s) { if (s === '' || s == null) return ''; const p = String(s).split('.'); p[0] = Number(p[0]).toLocaleString('en-US'); return p.join('.'); }
function dot(d) { return d ? d.replace(/-/g, '.') : ''; }
function slash(d) { return d ? d.replace(/-/g, '/') : ''; }
function md(d) { return d ? Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10)) : ''; }

$('#go').onclick = async () => {
  const items = readRows().filter(r => r.date);
  if (!items.length) { $('#msg').textContent = '請至少填一列消費日期'; return; }
  save();
  $('#msg').textContent = '';
  const btn = $('#go'); btn.disabled = true; btn.textContent = '查詢中…';
  try {
    if (!meta) throw new Error('匯率資料還沒載入，請確認網路後重新整理');
    render(await lookup(items, $('#cat').value));
  } catch (e) {
    $('#msg').textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = '算台幣';
  }
};

function render(j) {
  last = j;
  $('#title').value = j.dateFrom.replace(/-/g, '') + '~' + j.dateTo.slice(5).replace('-', '') + ' 出差行程費用明細';
  $('#rule').textContent = '匯率：兆豐銀行 即期 銀行買入，' + j.categoryLabel + '；採消費當日匯率，假日採前一營業日。';
  $('#rtBody').innerHTML = j.rateTable.map(r =>
    '<tr><td>' + esc(r.currency) + '</td><td class="num">' + esc(r.rate) + '</td><td>' + esc(slash(r.rateDate)) + '</td><td>' +
    esc(r.forDates.map(md).join('、')) + '</td></tr>').join('');
  let h = '';
  j.groups.forEach(g => {
    h += '<tr class="grp"><td colspan="7">' + esc(g.name) + '</td></tr>';
    g.rows.forEach(r => {
      h += '<tr><td>' + esc(dot(r.date)) + '</td><td>' + esc(g.name) + '</td><td>' + esc(r.note) +
        (r.remark ? (r.note ? '<br>' : '') + '<span class="remark">' + esc(r.remark) + '</span>' : '') + '</td><td>' + esc(r.currency) + '</td>' +
        '<td class="num">' + esc(fmtAmt(r.amount)) + '</td>' +
        '<td class="num' + (r.rate ? '' : ' bad') + '">' + esc(r.currency === 'TWD' ? '—' : (r.rate ? String(Number(r.rate)) : '查無')) + '</td>' +
        '<td class="num">' + esc(fmt(r.twd)) + '</td></tr>';
    });
    h += '<tr class="sub"><td colspan="5"></td><td class="num">台幣</td><td class="num">' + fmt(g.subtotal) + '</td></tr>';
  });
  h += '<tr class="tot"><td colspan="5"></td><td class="num">可報支合計</td><td class="num">NT$ ' + fmt(j.totalTwd) + '</td></tr>';
  $('#dtBody').innerHTML = h;
  $('#foot').innerHTML = '每筆台幣＝外幣金額 × 匯率，四捨五入到元；各類別小計＝各筆台幣加總。' +
    (j.missing ? '<b class="bad">有 ' + j.missing + ' 筆查無匯率，未計入合計。</b>' : '') +
    '<br>匯率來源：' + esc(j.source) + '（' + esc(j.sourceUrl) + '）　匯率資料更新：' + esc(j.dataUpdatedAt) + '　製表時間：' + esc(j.queriedAt);
  $('#src').href = j.sourceUrl;
  $('#copied').textContent = '';
  $('#result').style.display = 'block';
  $('#result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

$('#copy').onclick = async () => {
  if (!last) return;
  const TAB = String.fromCharCode(9), NL = String.fromCharCode(10);
  const lines = [[$('#title').value].join(TAB), ['兆豐即期匯率', '買入', '更新日期'].join(TAB)];
  last.rateTable.forEach(r => lines.push([r.currency, r.rate, slash(r.rateDate)].join(TAB)));
  lines.push('');
  lines.push(['消費日期', '類別', '說明', '幣別', '外幣金額', '匯率', '台幣', '備註'].join(TAB));
  last.groups.forEach(g => {
    g.rows.forEach(r => lines.push([dot(r.date), g.name, r.note, r.currency, r.amount, r.currency === 'TWD' ? '' : (r.rate || ''),r.twd == null ? '' : r.twd, r.remark].join(TAB)));
    lines.push(['', '', '', '', '', '台幣', g.subtotal, ''].join(TAB));
  });
  lines.push(['', '', '', '', '', '合計', last.totalTwd, ''].join(TAB));
  try { await navigator.clipboard.writeText(lines.join(NL)); $('#copied').textContent = '已複製，到 Excel 按 Ctrl+V 貼上'; }
  catch (e) { $('#copied').textContent = '複製失敗，請直接選取表格複製'; }
};
$('#print').onclick = () => window.print();
$('#png').onclick = async () => {
  if (!last) return;
  if (typeof html2canvas !== 'function') { $('#copied').textContent = '存圖元件沒載入（需要網路），請改用「列印／存 PDF」'; return; }
  try {
    const canvas = await html2canvas($('#sheet'), { scale: 2, backgroundColor: '#ffffff' });
    const a = document.createElement('a');
    a.download = '出差報支匯率佐證_' + last.dateFrom.replace(/-/g, '') + '-' + last.dateTo.replace(/-/g, '') + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    $('#copied').textContent = '圖片已存到「下載」資料夾';
  } catch (e) { $('#copied').textContent = '存圖失敗：' + e.message + '，請改用「列印／存 PDF」'; }
};

init();
</script>
</body>
</html>
